<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f4f4f4;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
        }

        input {
            padding: 10px;
            width: 70%;
        }

        button {
            padding: 10px;
        }

        li {
            margin: 10px 0;
        }

        a {
            margin-left: 10px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My To-Do List</h1>

    <form action="/add" method="POST">

        <input
            type="text"
            name="title"
            placeholder="Enter task"
            required
        >

        <button type="submit">Add</button>

    </form>

    <hr>

    <ul>

        {% for task in tasks %}

        <li>

            <span class="{% if task['completed'] %}completed{% endif %}">
                {{ task["title"] }}
            </span>

            {% if not task["completed"] %}

            <a href="/complete/{{ task['id'] }}">
                Complete
            </a>

            {% endif %}

            <a href="/delete/{{ task['id'] }}">
                Delete
            </a>

        </li>

        {% else %}

        <li>No tasks found.</li>

        {% endfor %}

    </ul>

</div>

</body>
</html>
