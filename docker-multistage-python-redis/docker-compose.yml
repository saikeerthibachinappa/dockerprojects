services:
  api:
    build: .
    ports:
     - "8080:5000"
    depends_on:
     - redis
    environment:
      REDIS_HOST: redis
    
  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3      
    
    
volumes:
   redis_data:    